<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pagina Demonstrativa</title>
    </head>
    <body>
        <div id="app"></div>
        <!-- Includem React și ReactDOM -->
        <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        <!-- Includem Babel pentru a transpila JSX-ul în JavaScript -->
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

        <script type="text/jsx">
            // Obținem referința la elementul cu id-ul "app"
            const app = document.getElementById("app");

            // Definim un component React cu props
            function Header({ title }) {
                return <h1>{title ? title : "Default title"}</h1>;
            }

            // Definim un component React cu o listă de nume
            function HomePage() {
                const names = [
                    "Ada Lovelace",
                    "Grace Hopper",
                    "Margaret Hamilton",
                ];

                // Definim o funcție care va fi apelată la click pe buton
                function handleClick() {
                    console.log("increment like count");
                }

                return (
                    <div>
                        <Header title="Develop. Preview. Ship." />
                        <ul>
                            {names.map((name) => (
                                <li key={name}>{name}</li>
                            ))}
                        </ul>
                        <button onClick={handleClick}>Like</button>
                    </div>
                );
            }

            // Creăm o rădăcină React
            const root = ReactDOM.createRoot(app);
            // Randăm un element React în rădăcină
            root.render(<HomePage />);
        </script>
    </body>
</html>
