<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pagina Demonstrativa</title>
    </head>
    <body>
        <div id="app"></div>
        <!-- Includem React și ReactDOM -->
        <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        <!-- Includem Babel pentru a transpila JSX-ul în JavaScript -->
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <script type="text/jsx">
            // Obținem referința la elementul cu id-ul "app"
            const app = document.getElementById("app");
            // Creăm o rădăcină React
            const root = ReactDOM.createRoot(app);
            // Randăm un element React în rădăcină
            root.render(<h1>Develop. Preview. Ship.</h1>);
        </script>
    </body>
</html>
